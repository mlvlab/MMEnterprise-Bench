[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmenterprise-bench"
version = "1.0.0"
description = "MMEnterprise-Bench: evaluating enterprise agents over evolving multimodal records"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "MLV Lab, KAIST" }]
keywords = ["benchmark", "multimodal", "enterprise", "retrieval-augmented-generation", "temporal-reasoning"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "huggingface_hub>=0.34",
]

[project.optional-dependencies]
hf = ["datasets>=2.19", "pyarrow>=14"]
generate = [
  "openai>=1.66,<3",
  "pydantic>=2.7,<3",
  "PyMuPDF>=1.24,<2",
  "Pillow>=10.4,<13",
  "matplotlib>=3.9,<4",
  "fonttools>=4.53,<5",
]
local = ["vllm==0.24.0"]

[project.urls]
Homepage = "https://mlvlab.github.io/MMEnterprise-Bench/"
Repository = "https://github.com/mlvlab/MMEnterprise-Bench"
Dataset = "https://huggingface.co/datasets/MMEnterprise-Bench/MMEnterprise-Bench"

[project.scripts]
mmeb = "mmenterprise_bench.cli:main"

[tool.setuptools.packages.find]
include = ["mmenterprise_bench*"]

[tool.setuptools.package-data]
mmenterprise_bench = ["configs/*.json", "prompts/*.txt"]
