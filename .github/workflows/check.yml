name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -e ".[generate]"
      - run: mmeb --help
      # The dataset is not checked out in CI, so scripts/check.bash skips the dataset checks and says so.
      - run: bash scripts/check.bash
